<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧互動心智圖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
    // Set theme on load based on preference
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    // Override d3.linkHorizontal to support toggling between straight lines and curves
    (function () {
      const originalLinkHorizontal = d3.linkHorizontal;
      window.useStraightLines = false; // Default to curves, but allow toggling

      d3.linkHorizontal = function () {
        const originalGenerator = originalLinkHorizontal();
        let sourceAccessor = d => d.source;
        let targetAccessor = d => d.target;
        let xAccessor = d => d[0];
        let yAccessor = d => d[1];

        const generator = function (d) {
          if (!window.useStraightLines) {
            return originalGenerator(d);
          }
          const s = sourceAccessor(d);
          const t = targetAccessor(d);
          const x0 = xAccessor(s);
          const y0 = yAccessor(s);
          const x1 = xAccessor(t);
          const y1 = yAccessor(t);
          const x_mid = (x0 + x1) / 2;
          return `M${x0},${y0} L${x_mid},${y0} L${x_mid},${y1} L${x1},${y1}`;
        };

        generator.source = function (_) {
          if (arguments.length) {
            sourceAccessor = _;
            originalGenerator.source(_);
            return generator;
          }
          return sourceAccessor;
        };
        generator.target = function (_) {
          if (arguments.length) {
            targetAccessor = _;
            originalGenerator.target(_);
            return generator;
          }
          return targetAccessor;
        };
        generator.x = function (_) {
          if (arguments.length) {
            xAccessor = _;
            originalGenerator.x(_);
            return generator;
          }
          return xAccessor;
        };
        generator.y = function (_) {
          if (arguments.length) {
            yAccessor = _;
            originalGenerator.y(_);
            return generator;
          }
          return yAccessor;
        };

        return generator;
      };
    })();

    var transformer, mm;
    let activeNodeData = null;
    let activeNodeEl = null;

    // Simple markdown to tree parser (fallback if Transformer unavailable)
    function parseMarkdown(md) {
      const lines = md.split('\n');
      const root = { content: '', children: [], depth: 0 };
      const stack = [root];

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        let depth, content;
        const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)/);
        const bulletMatch = trimmed.match(/^[-*]\s+(.*)/);
        const indentedBulletMatch = line.match(/^(\s+)[-*]\s+(.*)/);

        if (headingMatch) {
          depth = headingMatch[1].length;
          content = headingMatch[2];
        } else if (indentedBulletMatch) {
          const indent = indentedBulletMatch[1].length;
          depth = 7 + Math.floor(indent / 2);
          content = indentedBulletMatch[2];
        } else if (bulletMatch) {
          depth = 7;
          content = bulletMatch[1];
        } else {
          continue;
        }

        const node = { content, children: [], depth };

        while (stack.length > 1 && stack[stack.length - 1].depth >= depth) {
          stack.pop();
        }
        stack[stack.length - 1].children.push(node);
        stack.push(node);
      }

      return root.children.length === 1 ? root.children[0] : root;
    }

    function buildMarkmapData(node) {
      return {
        content: node.content,
        children: (node.children || []).map(buildMarkmapData)
      };
    }

    function alignNodesWithLines(root, markdown) {
      const lines = markdown.split('\n');
      const nodeLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        if (!trimmed) continue;

        const isHeading = trimmed.match(/^(#{1,6})\s+/);
        const isBullet = trimmed.match(/^[-*]\s+/);
        const isIndentedBullet = line.match(/^(\s+)[-*]\s+/);

        if (isHeading || isBullet || isIndentedBullet) {
          nodeLines.push({
            lineIndex: i,
            lineContent: line
          });
        }
      }

      const treeNodes = [];
      function traverse(node) {
        if (!node) return;
        if (node.depth === 0 && !node.content && node.children && node.children.length > 0) {
          // Virtual root
        } else {
          treeNodes.push(node);
        }
        if (node.children) {
          node.children.forEach(traverse);
        }
      }

      traverse(root);

      const limit = Math.min(treeNodes.length, nodeLines.length);
      for (let i = 0; i < limit; i++) {
        treeNodes[i].lineIndex = nodeLines[i].lineIndex;
      }
    }

    const darkColors = ['#818cf8', '#c084fc', '#2dd4bf', '#fbbf24', '#f472b6', '#60a5fa', '#f87171', '#a3e635', '#22d3ee'];
    const lightColors = ['#4f46e5', '#9333ea', '#0d9488', '#d97706', '#db2777', '#2563eb', '#dc2626', '#65a30d', '#0891b2'];

    const darkStyle = (id) => `
    .${id} g { fill: #ffffff; font-weight: 500; font-family: ui-sans-serif, system-ui, sans-serif; }
    .${id} foreignObject { color: #ffffff; }
    .${id} circle { fill: #0f172a; }
`;

    const lightStyle = (id) => `
    .${id} g { fill: #0f172a; font-weight: 500; font-family: ui-sans-serif, system-ui, sans-serif; }
    .${id} foreignObject { color: #0f172a; }
    .${id} circle { fill: #ffffff; }
`;

    let isAllExpanded = false;

    function setAllNodesFold(node, foldVal) {
      if (!node) return;
      if (!node.payload) node.payload = {};
      node.payload.fold = foldVal;
      if (node.children) {
        node.children.forEach(child => setAllNodesFold(child, foldVal));
      }
    }

    function collapseAllNodes(node, depth = 1) {
      if (!node) return;
      if (!node.payload) node.payload = {};
      if (depth > 2) {
        node.payload.fold = 1;
      } else {
        delete node.payload.fold;
      }
      if (node.children) {
        node.children.forEach(child => collapseAllNodes(child, depth + 1));
      }
    }

    function resetExpandButton() {
      const btn = document.querySelector('#btn-expand-all');
      const mobileBtn = document.querySelector('#mobile-btn-expand-all');

      const updateBtnState = (b) => {
        if (!b) return;
        const icon = b.querySelector('i');
        const span = b.querySelector('span');
        icon.className = "fa-solid fa-angles-down";
        span.innerText = "一鍵展開";
      };

      updateBtnState(btn);
      updateBtnState(mobileBtn);
      isAllExpanded = false;
    }

    function toggleExpandAll() {
      const btn = document.querySelector('#btn-expand-all');
      const mobileBtn = document.querySelector('#mobile-btn-expand-all');

      const setExpandState = (b, expanded) => {
        if (!b) return;
        const icon = b.querySelector('i');
        const span = b.querySelector('span');
        if (expanded) {
          icon.className = "fa-solid fa-rotate-left";
          span.innerText = "恢復預設";
        } else {
          icon.className = "fa-solid fa-angles-down";
          span.innerText = "一鍵展開";
        }
      };

      if (isAllExpanded) {
        collapseAllNodes(mm.state.data);
        mm.setData(mm.state.data);
        setExpandState(btn, false);
        setExpandState(mobileBtn, false);
        isAllExpanded = false;
      } else {
        setAllNodesFold(mm.state.data, 0);
        mm.renderData();
        setExpandState(btn, true);
        setExpandState(mobileBtn, true);
        isAllExpanded = true;
      }
      pushState();
    }

    function toggleLineStyle() {
      const btn = document.querySelector('#btn-toggle-line');
      const mobileBtn = document.querySelector('#mobile-btn-toggle-line');

      window.useStraightLines = !window.useStraightLines;

      const updateStyleState = (b) => {
        if (!b) return;
        const icon = b.querySelector('i');
        const span = b.querySelector('span');
        if (window.useStraightLines) {
          icon.className = "fa-solid fa-bezier-curve";
          span.innerText = "曲線連結";
        } else {
          icon.className = "fa-solid fa-route";
          span.innerText = "直角折線";
        }
      };

      updateStyleState(btn);
      updateStyleState(mobileBtn);

      if (mm) {
        mm.renderData();
      }
    }

    function decodeHTMLEntities(text) {
      const textArea = document.createElement('textarea');
      textArea.innerHTML = text;
      return textArea.value;
    }

    let lastActiveNode = null;

    function findActiveNodeForLine(lineIndex) {
      if (!mm || !mm.state.data) return null;
      let closestNode = null;
      let maxLine = -1;

      function walk(node) {
        if (!node) return;
        if (node.lineIndex !== undefined && node.lineIndex <= lineIndex && node.lineIndex > maxLine) {
          maxLine = node.lineIndex;
          closestNode = node;
        }
        if (node.children) {
          node.children.forEach(walk);
        }
      }

      walk(mm.state.data);
      return closestNode;
    }

    function unfoldAncestors(targetNode) {
      if (!mm || !mm.state.data) return false;
      let path = [];
      let found = false;

      function findPath(node, currentPath) {
        if (!node || found) return;
        currentPath.push(node);
        if (node === targetNode) {
          path = [...currentPath];
          found = true;
          return;
        }
        if (node.children) {
          node.children.forEach(child => findPath(child, currentPath));
        }
        currentPath.pop();
      }

      findPath(mm.state.data, []);

      let updated = false;

      // 展開所有祖先節點以及目標節點本身
      for (let i = 0; i < path.length; i++) {
        if (!path[i].payload) path[i].payload = {};
        if (path[i].payload.fold !== 0) {
          path[i].payload.fold = 0;
          updated = true;
        }
      }

      // 同層級節點互斥：將路徑上每個節點的兄弟節點折疊
      for (let i = 1; i < path.length; i++) {
        const parent = path[i - 1];
        const currentNode = path[i];
        if (parent && parent.children) {
          parent.children.forEach(sibling => {
            if (sibling !== currentNode && sibling.children && sibling.children.length > 0) {
              if (!sibling.payload) sibling.payload = {};
              if (sibling.payload.fold !== 1) {
                sibling.payload.fold = 1;
                updated = true;
              }
            }
          });
        }
      }

      return updated;
    }

    function syncMapWithEditorCursor() {
      if (!mm || !mm.state.data) return;
      const editor = document.querySelector('#editor');
      const cursorPos = editor.selectionStart;
      const textBefore = editor.value.substring(0, cursorPos);
      const lineIndex = textBefore.split('\n').length - 1;

      const activeNode = findActiveNodeForLine(lineIndex);
      if (!activeNode) {
        if (lastActiveNode !== null) {
          lastActiveNode = null;
          mm.setHighlight(null);
        }
        return;
      }

      if (activeNode !== lastActiveNode) {
        lastActiveNode = activeNode;
        const wasFolded = unfoldAncestors(activeNode);
        if (wasFolded) {
          mm.renderData().then(() => {
            mm.setHighlight(activeNode);
            mm.centerNode(activeNode);
          });
        } else {
          mm.setHighlight(activeNode);
          mm.centerNode(activeNode);
        }
      }
    }


    // --- 歷程控制與分類排序優化程式碼 ---
    let historyStack = [];
    let historyIndex = -1;
    let isApplyingHistory = false;

    function sortFolderAndFiles(node, depth = 0) {
      if (!node || !node.children || node.children.length === 0) return;

      // 從第三層（depth >= 1）開始進行分類排序：資料夾置頂、檔案置底，內部按拼音字母排序
      if (depth >= 1) {
        node.children.sort((a, b) => {
          const isDirA = a.content.includes('📂');
          const isDirB = b.content.includes('📂');

          if (isDirA && !isDirB) return -1;
          if (!isDirA && isDirB) return 1;

          return a.content.localeCompare(b.content, 'zh-Hant');
        });
      }

      node.children.forEach(child => sortFolderAndFiles(child, depth + 1));
    }

    function pushState() {
      if (!mm || !mm.state.data || isApplyingHistory) return;

      const text = document.querySelector('#editor').value;
      const folds = saveFoldState(mm.state.data);
      const newState = { text, folds: JSON.parse(JSON.stringify(folds)) };

      if (historyIndex >= 0 && statesAreEqual(historyStack[historyIndex], newState)) {
        return;
      }

      historyStack = historyStack.slice(0, historyIndex + 1);
      historyStack.push(newState);
      historyIndex = historyStack.length - 1;

      updateUndoRedoButtons();
    }

    function statesAreEqual(s1, s2) {
      if (!s1 || !s2) return false;
      if (s1.text !== s2.text) return false;
      const keys1 = Object.keys(s1.folds);
      const keys2 = Object.keys(s2.folds);
      if (keys1.length !== keys2.length) return false;
      for (const k of keys1) {
        if (s1.folds[k] !== s2.folds[k]) return false;
      }
      return true;
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        restoreHistoryState(historyStack[historyIndex]);
      }
    }

    function redo() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        restoreHistoryState(historyStack[historyIndex]);
      }
    }

    function restoreHistoryState(state) {
      if (!state) return;
      isApplyingHistory = true;

      const editor = document.querySelector('#editor');
      if (editor.value !== state.text) {
        editor.value = state.text;
        updateMarkmapWithFolds(state.folds);
      } else {
        restoreFoldState(mm.state.data, state.folds);
        mm.renderData();  // 用 renderData 而非 setData，避免 _initializeData 重置折疊狀態
        updateUndoRedoButtons();
        isApplyingHistory = false;
      }
    }

    function updateMarkmapWithFolds(folds) {
      if (!mm) return;
      const markdown = document.querySelector('#editor').value;
      let root;
      if (transformer) {
        const result = transformer.transform(markdown);
        root = result.root;
      } else {
        root = buildMarkmapData(parseMarkdown(markdown));
      }
      alignNodesWithLines(root, markdown);
      lastActiveNode = null;

      mm.setData(root);
      restoreFoldState(mm.state.data, folds);
      mm.renderData();

      updateUndoRedoButtons();
      isApplyingHistory = false;
    }

    function updateUndoRedoButtons() {
      const btnUndo = document.getElementById('btn-undo');
      const btnRedo = document.getElementById('btn-redo');
      const mobUndo = document.getElementById('mobile-btn-undo');
      const mobRedo = document.getElementById('mobile-btn-redo');

      const canUndo = historyIndex > 0;
      const canRedo = historyIndex < historyStack.length - 1;

      if (btnUndo) btnUndo.disabled = !canUndo;
      if (btnRedo) btnRedo.disabled = !canRedo;

      if (mobUndo) {
        mobUndo.disabled = !canUndo;
        mobUndo.style.opacity = canUndo ? "1" : "0.4";
      }
      if (mobRedo) {
        mobRedo.disabled = !canRedo;
        mobRedo.style.opacity = canRedo ? "1" : "0.4";
      }
    }

    function checkAndPushFoldChange() {
      if (!mm || !mm.state.data || isApplyingHistory) return;
      const currentFolds = saveFoldState(mm.state.data);
      const lastFolds = historyIndex >= 0 ? historyStack[historyIndex].folds : {};
      if (JSON.stringify(currentFolds) !== JSON.stringify(lastFolds)) {
        pushState();
      }
    }

    function findParentNode(root, target) {
      if (!root || !root.children) return null;
      if (root.children.includes(target)) return root;
      for (const child of root.children) {
        const p = findParentNode(child, target);
        if (p) return p;
      }
      return null;
    }

    function autoCollapseSiblings(targetNode) {
      if (!mm || !mm.state.data || !targetNode) return;
      const parent = findParentNode(mm.state.data, targetNode);
      if (!parent || !parent.children) return;

      parent.children.forEach(sibling => {
        if (sibling !== targetNode && sibling.children && sibling.children.length > 0) {
          if (!sibling.payload) sibling.payload = {};
          sibling.payload.fold = 1;
        }
      });
    }
    // -----------------------------------------------------

    function initMarkmap() {
      const { Markmap } = window.markmap;
      const svgEl = document.querySelector('#markmap');
      const isDark = document.documentElement.classList.contains('dark');
      const currentColors = isDark ? darkColors : lightColors;
      const currentStyle = isDark ? darkStyle : lightStyle;

      mm = Markmap.create(svgEl, {
        zoom: true,
        pan: true,
        initialExpandLevel: 2,
        spacingVertical: 10,
        spacingHorizontal: 80,
        color: (node) => {
          const depth = node.state ? node.state.depth : (node.depth || 0);
          return currentColors[depth % currentColors.length];
        },
        style: currentStyle
      });

      // 覆寫 _relayout：
      //   Step 1 - 重新分配 Y 座標為均勻間距（消除 D3 flextree 因 subtree 高度撐開垂直的副作用）
      //   Step 2 - 只把 X 軸向右拉伸到指定 gap
      const _origRelayout = mm._relayout.bind(mm);
      mm._relayout = function () {
        _origRelayout();
        if (!this.state.data) return;
        const spacingV = this.options.spacingVertical || 10;

        // Step 1: 均勻重排 Y，每個節點的子節點以固定間距排列在父節點上下
        const redistributeY = (node) => {
          if (!node || !node.state || !node.state.rect) return;
          const children = node.children || [];
          if (!children.length) return;
          // 取出節點高度（state.size[1] 是節點本身的高，fallback 20px）
          const nodeH = (node.state.size && node.state.size[1]) ? node.state.size[1] : 20;
          const step = nodeH + spacingV;
          const parentY = node.state.rect.y;
          const totalSpan = (children.length - 1) * step;
          const startY = parentY - totalSpan / 2;
          children.forEach((child, i) => {
            if (child.state && child.state.rect) child.state.rect.y = startY + i * step;
            redistributeY(child);
          });
        };
        redistributeY(this.state.data);

        // Step 2: 固定 gap 拉伸 X 軸
        const GAP_L1 = 180;  // root → 第一層
        const GAP_DEEP = 300; // 第二層以下
        const adjustX = (node, depth, parentRightX) => {
          if (!node || !node.state || !node.state.rect) return;
          const gap = depth === 0 ? 0 : (depth === 1 ? GAP_L1 : GAP_DEEP);
          if (depth > 0) node.state.rect.x = parentRightX + gap;
          const rightX = node.state.rect.x + node.state.rect.width;
          (node.children || []).forEach(c => adjustX(c, depth + 1, rightX));
        };
        adjustX(this.state.data, 0, 0);

        // Step 3: 重新計算 bounding box 讓 fit() 正確（過濾折疊子節點與 NaN 值以防止縮放故障）
        const allNodes = [];
        const collect = n => {
          if (!n) return;
          allNodes.push(n);
          if (n.payload && n.payload.fold) return; // 折疊的節點其子節點不納入計算
          (n.children || []).forEach(collect);
        };
        collect(this.state.data);
        const rects = allNodes
          .map(n => n.state && n.state.rect)
          .filter(r => r &&
            typeof r.x === 'number' && !isNaN(r.x) &&
            typeof r.y === 'number' && !isNaN(r.y) &&
            typeof r.width === 'number' && !isNaN(r.width) &&
            typeof r.height === 'number' && !isNaN(r.height)
          );
        if (rects.length) this.state.rect = {
          x1: Math.min(...rects.map(r => r.x)),
          y1: Math.min(...rects.map(r => r.y)),
          x2: Math.max(...rects.map(r => r.x + r.width)),
          y2: Math.max(...rects.map(r => r.y + r.height))
        };
      };

      // Try to get Transformer from markmap-lib
      if (window.markmap && window.markmap.Transformer) {
        transformer = new window.markmap.Transformer();
        console.log('Using markmap Transformer');
      } else {
        console.log('Transformer not available, using built-in parser');
      }

      setTimeout(() => { updateMarkmap(true); }, 100);
      setupEditEvents();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      if (mm) {
        const currentColors = isDark ? darkColors : lightColors;
        const currentStyle = isDark ? darkStyle : lightStyle;
        mm.setOptions({
          color: (node) => {
            const depth = node.state ? node.state.depth : (node.depth || 0);
            return currentColors[depth % currentColors.length];
          },
          style: currentStyle
        });
        mm.updateStyle();
        mm.renderData();
      }
    }

    function saveFoldState(node, map = {}) {
      if (!node) return map;
      if (node.content !== undefined) {
        map[node.content] = node.payload?.fold ?? null;
      }
      (node.children || []).forEach(c => saveFoldState(c, map));
      return map;
    }

    function restoreFoldState(node, map) {
      if (!node) return;
      if (node.content !== undefined && map[node.content] !== undefined && map[node.content] !== null) {
        if (!node.payload) node.payload = {};
        node.payload.fold = map[node.content];
      }
      (node.children || []).forEach(c => restoreFoldState(c, map));
    }

    function updateMarkmap(isFirstLoad = false) {
      if (!mm) return;
      const markdown = document.querySelector('#editor').value;

      // 編輯時快照現有折疊狀態，稍後還原
      const foldSnapshot = (!isFirstLoad && mm.state.data) ? saveFoldState(mm.state.data) : {};

      let root;
      if (transformer) {
        const result = transformer.transform(markdown);
        root = result.root;
      } else {
        root = buildMarkmapData(parseMarkdown(markdown));
      }

      alignNodesWithLines(root, markdown);
      lastActiveNode = null;
      mm.setData(root);

      // 將快照的折疊狀態還原到實際的 state.data 中，並重新渲染
      if (!isFirstLoad) {
        restoreFoldState(mm.state.data, foldSnapshot);
        mm.renderData();
        // 文字編輯才推歷史（折疊操作由 checkAndPushFoldChange 負責）
        pushState();
      }

      // 只在首次載入時 fit，避免編輯時視角跳動
      if (isFirstLoad) mm.fit();

      resetExpandButton();
    }

    function setupEditEvents() {
      const svgEl = document.querySelector('#markmap');
      const contextMenu = document.querySelector('#context-menu');
      const inlineEditorContainer = document.querySelector('#inline-editor-container');
      const inlineEditor = document.querySelector('#inline-editor');

      svgEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const nodeEl = e.target.closest('.markmap-node');
        const containerRect = document.querySelector('#map-container').getBoundingClientRect();
        contextMenu.style.left = `${e.clientX - containerRect.left}px`;
        contextMenu.style.top = `${e.clientY - containerRect.top}px`;

        const optEdit = document.querySelector('#menu-opt-edit');
        const optChild = document.querySelector('#menu-opt-child');
        const optSibling = document.querySelector('#menu-opt-sibling');
        const optParent = document.querySelector('#menu-opt-parent');
        const optSep = document.querySelector('#menu-opt-sep');
        const optDelete = document.querySelector('#menu-opt-delete');

        if (nodeEl) {
          // Clicked on a node
          activeNodeEl = nodeEl;
          activeNodeData = nodeEl.__data__;

          if (optEdit) optEdit.style.display = 'flex';
          if (optChild) optChild.style.display = 'flex';
          if (optSibling) optSibling.style.display = 'flex';
          if (optParent) optParent.style.display = 'none';
          if (optSep) optSep.style.display = 'block';
          if (optDelete) optDelete.style.display = 'flex';
        } else {
          // Clicked on empty space
          activeNodeEl = null;
          activeNodeData = null;

          if (optEdit) optEdit.style.display = 'none';
          if (optChild) optChild.style.display = 'none';
          if (optSibling) optSibling.style.display = 'none';
          if (optParent) optParent.style.display = 'flex';
          if (optSep) optSep.style.display = 'none';
          if (optDelete) optDelete.style.display = 'none';
        }

        contextMenu.classList.remove('hidden');
        inlineEditorContainer.classList.add('hidden');
      });

      svgEl.addEventListener('dblclick', (e) => {
        const nodeEl = e.target.closest('.markmap-node');
        if (!nodeEl) return;
        e.preventDefault();
        e.stopPropagation();

        activeNodeEl = nodeEl;
        activeNodeData = nodeEl.__data__;

        if (!activeNodeData || activeNodeData.lineIndex === undefined) return;

        showInlineEditor();
      }, true);

      document.addEventListener('click', (e) => {
        if (!contextMenu.contains(e.target)) {
          contextMenu.classList.add('hidden');
        }
        if (!inlineEditorContainer.contains(e.target) && !e.target.closest('.markmap-node')) {
          commitInlineEdit();
        }
      });

      inlineEditor.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          commitInlineEdit();
        } else if (e.key === 'Escape') {
          inlineEditorContainer.classList.add('hidden');
        }
      });

      const editor = document.querySelector('#editor');
      editor.addEventListener('click', syncMapWithEditorCursor);
      editor.addEventListener('keyup', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) {
          syncMapWithEditorCursor();
        }
      });
      editor.addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(() => updateMarkmap(false), 300);
      });

      svgEl.addEventListener('click', (event) => {
        const circleEl = event.target.closest('circle');
        const nodeEl = event.target.closest('.markmap-node');
        if (circleEl && nodeEl) {
          const d = nodeEl.__data__;
          if (d && d.payload && d.payload.fold === 1) {
            const depth = d.state ? d.state.depth : (d.depth || 0);
            if (depth >= 1) {
              autoCollapseSiblings(d);
            }
          }
        }

        if (nodeEl) {
          const d = nodeEl.__data__;
          if (d && d.lineIndex !== undefined) {
            focusEditorOnNode(d);
            mm.setHighlight(d);
          }
        }
        setTimeout(checkAndPushFoldChange, 150);
      }, true);
    }

    function showInlineEditor() {
      const inlineEditorContainer = document.querySelector('#inline-editor-container');
      const inlineEditor = document.querySelector('#inline-editor');
      const containerRect = document.querySelector('#map-container').getBoundingClientRect();
      const nodeRect = activeNodeEl.getBoundingClientRect();

      inlineEditor.value = decodeHTMLEntities(activeNodeData.content);
      inlineEditorContainer.style.left = `${nodeRect.left - containerRect.left}px`;
      inlineEditorContainer.style.top = `${nodeRect.top - containerRect.top - 5}px`;
      inlineEditorContainer.style.width = `${Math.max(nodeRect.width + 10, 160)}px`;
      inlineEditorContainer.classList.remove('hidden');
      inlineEditor.focus();
      inlineEditor.select();

      document.querySelector('#context-menu').classList.add('hidden');
    }

    function commitInlineEdit() {
      const inlineEditorContainer = document.querySelector('#inline-editor-container');
      if (inlineEditorContainer.classList.contains('hidden') || !activeNodeData) return;

      const newValue = document.querySelector('#inline-editor').value.trim();
      if (newValue && newValue !== activeNodeData.content) {
        updateMarkdownLine(activeNodeData.lineIndex, newValue);
      }
      inlineEditorContainer.classList.add('hidden');
    }

    function getLineDepth(line) {
      const trimmed = line.trim();
      const headingMatch = trimmed.match(/^(#{1,6})\s+/);
      const indentedBulletMatch = line.match(/^(\s+)[-*]\s+/);
      const bulletMatch = trimmed.match(/^[-*]\s+/);

      if (headingMatch) {
        return headingMatch[1].length;
      } else if (indentedBulletMatch) {
        const indent = indentedBulletMatch[1].length;
        return 7 + Math.floor(indent / 2);
      } else if (bulletMatch) {
        return 7;
      }
      return 999;
    }

    function findDescendantEndIndex(lines, startIndex, baseDepth) {
      let i = startIndex + 1;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) {
          i++;
          continue;
        }
        const depth = getLineDepth(line);
        if (depth <= baseDepth) {
          break;
        }
        i++;
      }
      return i;
    }

    function updateMarkdownLine(lineIndex, newText) {
      const editor = document.querySelector('#editor');
      const lines = editor.value.split('\n');
      const originalLine = lines[lineIndex];
      const match = originalLine.match(/^(\s*(?:#{1,6}|[-*])\s+)/);
      const prefix = match ? match[1] : '';

      lines[lineIndex] = prefix + newText;
      editor.value = lines.join('\n');
      updateMarkmap(false);
      pushState();
    }

    function menuAddParentTheme() {
      document.querySelector('#context-menu').classList.add('hidden');

      const editor = document.querySelector('#editor');
      let insertText = '# 新獨立主題';

      editor.value = editor.value.trimEnd() + '\n\n' + insertText;
      updateMarkmap(false);

      // Scroll to the bottom of the editor
      editor.scrollTop = editor.scrollHeight;

      setTimeout(() => {
        const svgEl = document.querySelector('#markmap');
        const nodeEls = svgEl.querySelectorAll('.markmap-node');
        const newLines = editor.value.split('\n');
        const newIndex = newLines.length - 1;

        for (const el of nodeEls) {
          if (el.__data__ && el.__data__.lineIndex === newIndex) {
            activeNodeEl = el;
            activeNodeData = el.__data__;

            // Highlight and center on the new root node
            mm.setHighlight(activeNodeData);
            mm.centerNode(activeNodeData);

            showInlineEditor();
            break;
          }
        }
      }, 400);
    }

    function menuEditNode() {
      document.querySelector('#context-menu').classList.add('hidden');
      showInlineEditor();
    }

    function menuAddChild() {
      document.querySelector('#context-menu').classList.add('hidden');
      if (!activeNodeData) return;

      const editor = document.querySelector('#editor');
      const lines = editor.value.split('\n');
      const lineIndex = activeNodeData.lineIndex;
      const parentLine = lines[lineIndex];

      const headingMatch = parentLine.match(/^(\s*)(#{1,6})\s+/);
      const bulletMatch = parentLine.match(/^(\s*)([-*])\s+/);
      let childPrefix = '';

      if (headingMatch) {
        const indent = headingMatch[1];
        const hashes = headingMatch[2];
        if (hashes.length < 6) {
          childPrefix = indent + hashes + '# ';
        } else {
          childPrefix = indent + '- ';
        }
      } else if (bulletMatch) {
        const indent = bulletMatch[1];
        childPrefix = indent + '  - ';
      } else {
        childPrefix = '- ';
      }

      lines.splice(lineIndex + 1, 0, childPrefix + '新子節點');
      editor.value = lines.join('\n');
      updateMarkmap(false);

      setTimeout(() => {
        const svgEl = document.querySelector('#markmap');
        const nodeEls = svgEl.querySelectorAll('.markmap-node');
        for (const el of nodeEls) {
          if (el.__data__ && el.__data__.lineIndex === lineIndex + 1) {
            activeNodeEl = el;
            activeNodeData = el.__data__;
            showInlineEditor();
            break;
          }
        }
      }, 400);
    }

    function menuAddSibling() {
      document.querySelector('#context-menu').classList.add('hidden');
      if (!activeNodeData) return;

      const editor = document.querySelector('#editor');
      const lines = editor.value.split('\n');
      const lineIndex = activeNodeData.lineIndex;
      const currentLine = lines[lineIndex];
      const baseDepth = getLineDepth(currentLine);

      const match = currentLine.match(/^(\s*(?:#{1,6}|[-*])\s+)/);
      const prefix = match ? match[1] : '- ';

      const insertIndex = findDescendantEndIndex(lines, lineIndex, baseDepth);

      lines.splice(insertIndex, 0, prefix + '新節點');
      editor.value = lines.join('\n');
      updateMarkmap(false);

      setTimeout(() => {
        const svgEl = document.querySelector('#markmap');
        const nodeEls = svgEl.querySelectorAll('.markmap-node');
        for (const el of nodeEls) {
          if (el.__data__ && el.__data__.lineIndex === insertIndex) {
            activeNodeEl = el;
            activeNodeData = el.__data__;
            showInlineEditor();
            break;
          }
        }
      }, 400);
    }

    function menuDeleteNode() {
      document.querySelector('#context-menu').classList.add('hidden');
      if (!activeNodeData) return;

      const editor = document.querySelector('#editor');
      const lines = editor.value.split('\n');
      const lineIndex = activeNodeData.lineIndex;
      const currentLine = lines[lineIndex];
      const baseDepth = getLineDepth(currentLine);

      const endIndex = findDescendantEndIndex(lines, lineIndex, baseDepth);
      lines.splice(lineIndex, endIndex - lineIndex);

      editor.value = lines.join('\n');
      updateMarkmap(false);
      pushState();
    }

    // --- 搜尋功能相關邏輯 ---
    let searchResults = [];
    let searchResultIndex = -1;
    let currentSearchKeyword = "";
    let searchDebounceTimeout;

    function focusEditorOnNode(node) {
      if (!node || node.lineIndex === undefined) return;
      const editor = document.querySelector('#editor');
      if (!editor) return;
      const lines = editor.value.split('\n');
      let charIndex = 0;
      for (let i = 0; i < node.lineIndex; i++) {
        charIndex += lines[i].length + 1;
      }
      editor.focus();
      editor.setSelectionRange(charIndex, charIndex + lines[node.lineIndex].length);

      const lineHeight = 24;
      editor.scrollTop = node.lineIndex * lineHeight - editor.clientHeight / 2;
    }

    function performSearch(keyword, direction = 1) {
      if (!mm || !mm.state.data) return;
      keyword = keyword.trim().toLowerCase();

      const desktopInput = document.getElementById('desktop-search-input');
      const mobileInput = document.getElementById('mobile-search-input');

      // 同步輸入框內容
      if (desktopInput && desktopInput.value !== keyword) desktopInput.value = keyword;
      if (mobileInput && mobileInput.value !== keyword) mobileInput.value = keyword;

      if (!keyword) {
        searchResults = [];
        searchResultIndex = -1;
        currentSearchKeyword = "";
        updateSearchUIStatus("");
        return;
      }

      // 如果關鍵字改變，重新搜尋
      if (keyword !== currentSearchKeyword) {
        currentSearchKeyword = keyword;
        searchResults = [];

        function walk(node) {
          if (!node) return;
          if (node.content) {
            const decoded = decodeHTMLEntities(node.content).toLowerCase();
            if (decoded.includes(keyword)) {
              searchResults.push(node);
            }
          }
          if (node.children) {
            node.children.forEach(walk);
          }
        }
        walk(mm.state.data);

        // 排序 searchResults，照 lineIndex 排序
        searchResults.sort((a, b) => {
          const lineA = a.lineIndex !== undefined ? a.lineIndex : 0;
          const lineB = b.lineIndex !== undefined ? b.lineIndex : 0;
          return lineA - lineB;
        });

        searchResultIndex = searchResults.length > 0 ? 0 : -1;
      } else {
        // 如果關鍵字相同，只是要往上或往下尋找
        if (searchResults.length > 0) {
          searchResultIndex = (searchResultIndex + direction + searchResults.length) % searchResults.length;
        }
      }

      if (searchResults.length > 0) {
        const targetNode = searchResults[searchResultIndex];
        const statusText = `${searchResultIndex + 1} / ${searchResults.length}`;
        updateSearchUIStatus(statusText, true);

        // 定位並展開
        const wasFolded = unfoldAncestors(targetNode);
        if (wasFolded) {
          mm.renderData().then(() => {
            mm.setHighlight(targetNode);
            mm.centerNode(targetNode);
          });
        } else {
          mm.setHighlight(targetNode);
          mm.centerNode(targetNode);
        }

        // 同步定位編輯器
        focusEditorOnNode(targetNode);
      } else {
        updateSearchUIStatus("找不到結果", false);
      }
    }

    function updateSearchUIStatus(text, hasResults = false) {
      const desktopStatus = document.getElementById('desktop-search-status');
      const mobileStatus = document.getElementById('mobile-search-status');

      if (desktopStatus) {
        desktopStatus.innerText = text;
        if (text) {
          desktopStatus.classList.remove('hidden');
          if (hasResults) {
            desktopStatus.className = "absolute right-10 inset-y-0 flex items-center text-[10px] pointer-events-none select-none text-indigo-600 dark:text-indigo-400 font-semibold bg-white dark:bg-slate-800 px-1";
          } else {
            desktopStatus.className = "absolute right-10 inset-y-0 flex items-center text-[10px] pointer-events-none select-none text-rose-500 font-semibold bg-white dark:bg-slate-800 px-1";
          }
        } else {
          desktopStatus.classList.add('hidden');
        }
      }
      if (mobileStatus) {
        mobileStatus.innerText = text;
        if (text) {
          mobileStatus.classList.remove('hidden');
          mobileStatus.className = `text-[11px] mt-1 font-semibold ${hasResults ? 'text-indigo-600 dark:text-indigo-400' : 'text-rose-500'}`;
        } else {
          mobileStatus.classList.add('hidden');
        }
      }
    }

    function navigateSearch(direction) {
      const keyword = document.getElementById('desktop-search-input')?.value || document.getElementById('mobile-search-input')?.value || "";
      performSearch(keyword, direction);
    }

    function handleSearchKeydown(event) {
      if (event.key === 'Enter') {
        const keyword = event.target.value;
        performSearch(keyword, 1);
      }
    }

    function handleSearchInput(event) {
      clearTimeout(searchDebounceTimeout);
      const keyword = event.target.value;
      searchDebounceTimeout = setTimeout(() => {
        currentSearchKeyword = "";
        performSearch(keyword, 0);
      }, 300);
    }
    // -------------------------------------

    let timeout;

    let lastSplitPercent = 30;
    let lastSplitPercentMobile = 50;
    let activeViewMode = 'map';

    function isMobileView() {
      return window.innerWidth < 768;
    }

    function toggleMobileMenu() {
      const panel = document.querySelector('#mobile-menu-panel');
      const backdrop = document.querySelector('#mobile-menu-backdrop');
      if (!panel || !backdrop) return;

      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        backdrop.classList.remove('hidden');
        setTimeout(() => {
          panel.classList.remove('translate-x-full');
          backdrop.classList.remove('opacity-0');
          backdrop.classList.add('opacity-100');
        }, 10);
      } else {
        panel.classList.add('translate-x-full');
        backdrop.classList.remove('opacity-100');
        backdrop.classList.add('opacity-0');
        setTimeout(() => {
          panel.classList.add('hidden');
          backdrop.classList.add('hidden');
        }, 300);
      }
    }

    function setupDragBar() {
      const dragBar = document.querySelector('#drag-bar');
      const editorCol = document.querySelector('#editor-container');
      const mapCol = document.querySelector('#map-container');
      const main = document.querySelector('main');

      if (!dragBar) return;

      let isDragging = false;

      function onDragStart(e) {
        isDragging = true;
        mapCol.style.pointerEvents = 'none';
        document.body.style.cursor = isMobileView() ? 'row-resize' : 'col-resize';
        document.body.style.userSelect = 'none';
      }

      function onDragMove(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const mainRect = main.getBoundingClientRect();

        if (isMobileView()) {
          const offsetY = clientY - mainRect.top;
          const percentage = (offsetY / mainRect.height) * 100;
          if (percentage >= 15 && percentage <= 85) {
            lastSplitPercentMobile = percentage;
            editorCol.style.height = `${percentage}%`;
            editorCol.style.width = '100%';
            mapCol.style.height = `${100 - percentage}%`;
            mapCol.style.width = '100%';
          }
        } else {
          const offsetX = clientX - mainRect.left;
          const percentage = (offsetX / mainRect.width) * 100;
          if (percentage >= 20 && percentage <= 80) {
            lastSplitPercent = percentage;
            editorCol.style.width = `${percentage}%`;
            editorCol.style.height = '100%';
            mapCol.style.width = `${100 - percentage}%`;
            mapCol.style.height = '100%';
          }
        }
      }

      function onDragEnd() {
        if (isDragging) {
          isDragging = false;
          mapCol.style.pointerEvents = 'auto';
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          if (mm) mm.fit();
        }
      }

      // Mouse Events
      dragBar.addEventListener('mousedown', onDragStart);
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);

      // Touch Events (Mobile)
      dragBar.addEventListener('touchstart', onDragStart, { passive: true });
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('touchend', onDragEnd);
    }

    function switchView(mode) {
      activeViewMode = mode;
      const editorCol = document.querySelector('#editor-container');
      const mapCol = document.querySelector('#map-container');
      const dragBar = document.querySelector('#drag-bar');

      // Sync buttons for desktop
      const btns = {
        split: document.querySelector('#btn-view-split'),
        edit: document.querySelector('#btn-view-edit'),
        map: document.querySelector('#btn-view-map')
      };
      Object.values(btns).forEach(btn => {
        if (btn) btn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center space-x-1";
      });

      // Sync buttons for mobile
      const mobileBtns = {
        split: document.querySelector('#mobile-btn-view-split'),
        edit: document.querySelector('#mobile-btn-view-edit'),
        map: document.querySelector('#mobile-btn-view-map')
      };
      Object.values(mobileBtns).forEach(btn => {
        if (btn) btn.className = "py-1.5 rounded-md text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex flex-col items-center justify-center";
      });

      if (mode === 'split') {
        if (btns.split) btns.split.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all bg-indigo-600 text-white shadow-sm flex items-center space-x-1";
        if (mobileBtns.split) mobileBtns.split.className = "py-1.5 rounded-md text-xs font-medium bg-indigo-600 text-white shadow-sm flex flex-col items-center justify-center";

        editorCol.style.display = "flex";
        mapCol.style.display = "flex";
        if (dragBar) dragBar.style.display = "flex";

        if (isMobileView()) {
          editorCol.style.width = '100%';
          editorCol.style.height = `${lastSplitPercentMobile}%`;
          mapCol.style.width = '100%';
          mapCol.style.height = `${100 - lastSplitPercentMobile}%`;
        } else {
          editorCol.style.width = `${lastSplitPercent}%`;
          editorCol.style.height = '100%';
          mapCol.style.width = `${100 - lastSplitPercent}%`;
          mapCol.style.height = '100%';
        }
      } else if (mode === 'edit') {
        if (btns.edit) btns.edit.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all bg-indigo-600 text-white shadow-sm flex items-center space-x-1";
        if (mobileBtns.edit) mobileBtns.edit.className = "py-1.5 rounded-md text-xs font-medium bg-indigo-600 text-white shadow-sm flex flex-col items-center justify-center";

        editorCol.style.display = "flex";
        editorCol.style.width = "100%";
        editorCol.style.height = "100%";
        mapCol.style.display = "none";
        if (dragBar) dragBar.style.display = "none";
      } else if (mode === 'map') {
        if (btns.map) btns.map.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all bg-indigo-600 text-white shadow-sm flex items-center space-x-1";
        if (mobileBtns.map) mobileBtns.map.className = "py-1.5 rounded-md text-xs font-medium bg-indigo-600 text-white shadow-sm flex flex-col items-center justify-center";

        editorCol.style.display = "none";
        mapCol.style.display = "flex";
        mapCol.style.width = "100%";
        mapCol.style.height = "100%";
        if (dragBar) dragBar.style.display = "none";
      }
      setTimeout(() => { if (mm && mode !== 'edit') { mm.fit(); } }, 300);
    }

    window.addEventListener('resize', () => {
      if (activeViewMode === 'split') {
        const editorCol = document.querySelector('#editor-container');
        const mapCol = document.querySelector('#map-container');
        if (isMobileView()) {
          editorCol.style.width = '100%';
          editorCol.style.height = `${lastSplitPercentMobile}%`;
          mapCol.style.width = '100%';
          mapCol.style.height = `${100 - lastSplitPercentMobile}%`;
        } else {
          editorCol.style.width = `${lastSplitPercent}%`;
          editorCol.style.height = '100%';
          mapCol.style.width = `${100 - lastSplitPercent}%`;
          mapCol.style.height = '100%';
        }
      }
      if (mm && document.querySelector('#map-container').style.display !== 'none') { mm.fit(); }
    });

    function zoomIn() { mm.rescale(1.25); }
    function zoomOut() { mm.rescale(0.8); }
    function zoomFit() { mm.fit(); }

    function exportMarkdown() {
      const text = document.querySelector('#editor').value;
      const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '雲端硬碟檔案結構圖.md';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportSVG() {
      const svgEl = document.querySelector('#markmap');
      const clone = svgEl.cloneNode(true);
      const g = svgEl.querySelector('g');
      const bbox = g.getBBox();
      clone.setAttribute('viewBox', `${bbox.x - 50} ${bbox.y - 50} ${bbox.width + 100} ${bbox.height + 100}`);
      clone.setAttribute('width', bbox.width + 100);
      clone.setAttribute('height', bbox.height + 100);
      clone.style.backgroundColor = document.documentElement.classList.contains('dark') ? '#0f172a' : '#f8fafc';
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(clone);
      if (!source.match(/^<\?xml/)) {
        source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
      }
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '雲端硬碟檔案結構圖_心智圖.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    function formatEditorHeadings() {
      const editor = document.querySelector('#editor');
      if (!editor) return;
      const lines = editor.value.split('\n');
      const formatted = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.trim().startsWith('#') && i > 0 && lines[i - 1].trim() !== '') {
          formatted.push('');
        }
        formatted.push(line);
      }
      editor.value = formatted.join('\n');
    }

    function toggleInfoTooltip() {
      const tooltip = document.querySelector('#info-tooltip');
      if (tooltip) {
        tooltip.classList.toggle('hidden');
      }
    }

    // 點擊空白處自動收合提示

      const container = document.querySelector('#btn-info-toggle')?.parentElement;
      const tooltip = document.querySelector('#info-tooltip');
      if (container && tooltip && !container.contains(e.target) && !tooltip.classList.contains('hidden')) {
        tooltip.classList.add('hidden');
      }
    });

      initMarkmap();

          </button>
          <button id="mobile-btn-redo" onclick="redo(); toggleMobileMenu();" disabled
            class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-2.5 disabled:opacity-40 disabled:cursor-not-allowed">
            <i class="fa-solid fa-arrow-rotate-right"></i><span>重做</span>
          </button>
        </div>
      </div>
      <div class="h-px bg-slate-200 dark:bg-slate-700 my-2"></div>
      <!-- Markmap operations -->
      <div class="space-y-3">
        <span class="text-xs text-slate-400 font-semibold block uppercase tracking-wider">心智圖操作</span>
        <button onclick="zoomFit(); toggleMobileMenu();"
          class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-lg text-xs font-medium transition flex items-center space-x-2.5">
          <i class="fa-solid fa-compress w-4"></i><span>重設縮放</span>
        </button>
        <button id="mobile-btn-expand-all" onclick="toggleExpandAll(); toggleMobileMenu();"
          class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-lg text-xs font-medium transition flex items-center space-x-2.5">
          <i class="fa-solid fa-angles-down w-4"></i><span>一鍵展開</span>
        </button>
        <button id="mobile-btn-toggle-line" onclick="toggleLineStyle(); toggleMobileMenu();"
          class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-lg text-xs font-medium transition flex items-center space-x-2.5">
          <i class="fa-solid fa-route w-4"></i><span>直角折線</span>
        </button>
      </div>
      <div class="h-px bg-slate-200 dark:bg-slate-700 my-2"></div>
      <!-- File actions -->
      <div class="space-y-3">
        <span class="text-xs text-slate-400 font-semibold block uppercase tracking-wider">檔案匯出</span>
        <button onclick="exportMarkdown(); toggleMobileMenu();"
          class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-lg text-xs font-medium transition flex items-center space-x-2.5">
          <i class="fa-solid fa-file-code w-4"></i><span>匯出 .md</span>
        </button>
        <button onclick="exportSVG(); toggleMobileMenu();"
          class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-4 py-2.5 rounded-lg text-xs font-medium transition flex items-center space-x-2.5 shadow-md">
          <i class="fa-solid fa-download w-4"></i><span>下載 SVG 圖片</span>
        </button>
      </div>
      <div class="h-px bg-slate-200 dark:bg-slate-700 my-2"></div>
      <!-- Theme toggle -->
      <div class="space-y-3">
        <span class="text-xs text-slate-400 font-semibold block uppercase tracking-wider">主題設定</span>
        <button onclick="toggleTheme();"
          class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-lg text-xs font-medium transition flex items-center space-x-2.5">
          <i class="fa-solid fa-sun w-4 dark:hidden"></i>
          <i class="fa-solid fa-moon w-4 hidden dark:inline-block"></i>
          <span>切換深淺色</span>
        </button>
      </div>
    </div>
  </div>
  <!-- Mobile Menu Backdrop -->
  <div id="mobile-menu-backdrop" onclick="toggleMobileMenu()"
    class="hidden fixed inset-0 bg-slate-900/40 dark:bg-slate-950/60 z-40 transition-opacity duration-300 opacity-0">
  </div>

</body>

</html>
