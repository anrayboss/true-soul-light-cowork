<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經濟模型大迭代：從商品邏輯到注意力邏輯</title>
    <style>
        :root {
            --color-bg: #FCFCFC;
            --color-text: #083344;
            --color-text-muted: #475569;
            --color-cyber-blue: #0EA5E9;
            --color-card-bg: #F0F9FF;
            --color-border: #E2E8F0;
            --color-green: #22C55E;
            --color-red: #EF4444;
            --color-dark-bg: #083344;
            --font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 16:9 簡報安全容器 */
        .slide-container {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * 16 / 9);
            max-height: calc(100vw * 9 / 16);
            aspect-ratio: 16 / 9;
            background-color: var(--color-bg);
            position: relative;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(8, 51, 68, 0.08);
            border-radius: 12px;
            border: 1px solid var(--color-border);
        }

        /* 頂部標題 */
        .header {
            margin-bottom: 20px;
        }

        .slide-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--color-text);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slide-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 32px;
            background: linear-gradient(180deg, var(--color-cyber-blue), #0284C7);
            border-radius: 3px;
        }

        /* 主內容區：雙欄排版 */
        .main-content {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            gap: 40px;
            flex-grow: 1;
            align-items: center;
            min-height: 0; /* 防止溢出 */
        }

        /* 左欄：傳統經濟模型 */
        .left-column {
            background: #ffffff;
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
        }

        .column-label {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text-muted);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flow-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .flow-card {
            width: 100%;
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--color-text-muted);
            transition: all 0.3s ease;
        }

        .flow-card:hover {
            transform: translateY(-2px);
            border-color: var(--color-cyber-blue);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.1);
            color: var(--color-text);
        }

        .flow-arrow {
            color: var(--color-cyber-blue);
            font-size: 20px;
            animation: bounceY 2s infinite ease-in-out;
        }

        /* 右欄：注意力經濟學模型 */
        .right-column {
            background: #ffffff;
            border: 1px solid var(--color-cyber-blue);
            border-radius: 16px;
            padding: 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.05);
        }

        .column-label.active {
            color: var(--color-cyber-blue);
        }

        .funnel-visualization {
            display: grid;
            grid-template-columns: 1.2fr 1.3fr;
            gap: 20px;
            align-items: center;
            flex-grow: 1;
        }

        /* 3D 漏斗 SVG 容器 */
        .svg-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .funnel-svg {
            width: 100%;
            max-height: 290px;
            filter: drop-shadow(0 10px 15px rgba(8, 51, 68, 0.1));
        }

        /* 漏斗各層標籤說明 */
        .labels-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .label-card {
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .label-card:hover {
            transform: translateX(5px);
            background-color: var(--color-card-bg);
            border-color: var(--color-cyber-blue);
        }

        .dot-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-1 { background-color: #38BDF8; }
        .dot-2 { background-color: #0EA5E9; }
        .dot-3 { background-color: #0284C7; }
        .dot-4 { background-color: var(--color-green); }

        /* 底部：核心公式 */
        .footer {
            background-color: var(--color-dark-bg);
            border-radius: 12px;
            padding: 18px 24px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .formula-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .formula-subtext {
            color: var(--color-cyber-blue);
            font-size: 13px;
            font-weight: 500;
        }

        /* 動畫 */
        @keyframes bounceY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        .funnel-layer {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .funnel-layer:hover {
            filter: brightness(1.15) saturate(1.1);
            transform: scale(1.02);
            transform-origin: center;
        }
    </style>
</head>
<body>

    <div class="slide-container">
        
        <!-- Header -->
        <div class="header">
            <h1 class="slide-title">經濟模型大迭代：從商品邏輯到注意力邏輯</h1>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            
            <!-- Left: Traditional -->
            <div class="left-column">
                <div class="column-label">傳統經濟模型</div>
                <div class="flow-container">
                    <div class="flow-card">生產商品</div>
                    <div class="flow-arrow">↓</div>
                    <div class="flow-card">銷售商品</div>
                    <div class="flow-arrow">↓</div>
                    <div class="flow-card">賺取利潤</div>
                </div>
            </div>

            <!-- Right: Attention Economics -->
            <div class="right-column">
                <div class="column-label active">注意力經濟學模型</div>
                
                <div class="funnel-visualization">
                    
                    <!-- SVG 3D Funnel -->
                    <div class="svg-container">
                        <svg class="funnel-svg" viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="layer1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#7DD3FC" />
                                    <stop offset="50%" stop-color="#38BDF8" />
                                    <stop offset="100%" stop-color="#0EA5E9" />
                                </linearGradient>
                                <linearGradient id="layer2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#38BDF8" />
                                    <stop offset="50%" stop-color="#0EA5E9" />
                                    <stop offset="100%" stop-color="#0284C7" />
                                </linearGradient>
                                <linearGradient id="layer3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#0EA5E9" />
                                    <stop offset="50%" stop-color="#0284C7" />
                                    <stop offset="100%" stop-color="#0369A1" />
                                </linearGradient>
                                <linearGradient id="layer4-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#0284C7" />
                                    <stop offset="50%" stop-color="#0369A1" />
                                    <stop offset="100%" stop-color="#075985" />
                                </linearGradient>
                                <linearGradient id="inner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#0F172A" />
                                    <stop offset="100%" stop-color="#1E293B" />
                                </linearGradient>
                                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="5" result="blur" />
                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                </filter>
                            </defs>
                            
                            <!-- Falling Particles -->
                            <g>
                                <circle cx="150" cy="30" r="4" fill="#38BDF8">
                                    <animate attributeName="cy" values="10;55" dur="1.8s" repeatCount="indefinite" />
                                    <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite" />
                                </circle>
                                <circle cx="130" cy="20" r="3" fill="#7DD3FC">
                                    <animate attributeName="cy" values="5;55" dur="2.2s" repeatCount="indefinite" />
                                    <animate attributeName="opacity" values="1;0" dur="2.2s" repeatCount="indefinite" />
                                </circle>
                                <circle cx="170" cy="25" r="4.5" fill="#0EA5E9">
                                    <animate attributeName="cy" values="8;55" dur="1.5s" repeatCount="indefinite" />
                                    <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
                                </circle>
                            </g>

                            <!-- Funnel Layer 4 (Bottom) -->
                            <g class="funnel-layer">
                                <path d="M 125,190 A 25,8 0 0,0 175,190 L 160,225 A 10,4 0 0,1 140,225 Z" fill="url(#layer4-grad)" />
                                <ellipse cx="150" cy="190" rx="25" ry="8" fill="url(#inner-grad)" stroke="#0369A1" stroke-width="0.5" />
                            </g>

                            <!-- Funnel Layer 3 -->
                            <g class="funnel-layer">
                                <path d="M 110,140 A 40,11 0 0,0 190,140 L 172,175 A 22,7 0 0,1 128,175 Z" fill="url(#layer3-grad)" />
                                <ellipse cx="150" cy="140" rx="40" ry="11" fill="url(#inner-grad)" stroke="#0284C7" stroke-width="0.5" />
                            </g>

                            <!-- Funnel Layer 2 -->
                            <g class="funnel-layer">
                                <path d="M 90,90 A 60,15 0 0,0 210,90 L 186,125 A 36,10 0 0,1 114,125 Z" fill="url(#layer2-grad)" />
                                <ellipse cx="150" cy="90" rx="60" ry="15" fill="url(#inner-grad)" stroke="#0EA5E9" stroke-width="0.5" />
                            </g>

                            <!-- Funnel Layer 1 (Top) -->
                            <g class="funnel-layer">
                                <path d="M 70,45 A 80,18 0 0,0 230,45 L 206,75 A 56,14 0 0,1 94,75 Z" fill="url(#layer1-grad)" />
                                <ellipse cx="150" cy="45" rx="80" ry="18" fill="none" stroke="#7DD3FC" stroke-width="1.5" />
                                <ellipse cx="150" cy="45" rx="75" ry="16" fill="url(#inner-grad)" opacity="0.85" />
                            </g>

                            <!-- Glowing Diamond -->
                            <g filter="url(#glow)">
                                <path d="M 150,250 L 165,265 L 150,285 L 135,265 Z" fill="var(--color-green)" />
                                <path d="M 150,250 L 150,285" stroke="#16A34A" stroke-width="1" />
                                <path d="M 135,265 L 165,265" stroke="#16A34A" stroke-width="1" />
                            </g>
                        </svg>
                    </div>

                    <!-- Labels -->
                    <div class="labels-container">
                        <div class="label-card">
                            <span class="dot-indicator dot-1"></span>
                            <span>1. 吸引注意力（入口）</span>
                        </div>
                        <div class="label-card">
                            <span class="dot-indicator dot-2"></span>
                            <span>2. 佔領時間（留存）</span>
                        </div>
                        <div class="label-card">
                            <span class="dot-indicator dot-3"></span>
                            <span>3. 影響行為（轉化）</span>
                        </div>
                        <div class="label-card">
                            <span class="dot-indicator dot-4"></span>
                            <span>4. 創造收益（變現）</span>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="formula-text">核心財富公式：注意力 ➔ 流量 ➔ 影響力 ➔ 購買力 ➔ 財富</div>
            <div class="formula-subtext">（今天最賺錢的企業，本質上都在經營注意力）</div>
        </div>

    </div>

</body>
</html>
