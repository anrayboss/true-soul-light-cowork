<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電商防護盾 — 完整課程地圖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg: #060a12;
  --border: rgba(80,160,255,0.13);
  --text: #c8d8f0;
  --dim: #5a7898;
  --accent: #00b4ff;
  --node-h: 52px;
  --lesson-h: 36px;
  --outline-h: 28px;
  --col-w: 160px;
  --gap: 24px;
  --hdr-bg: rgba(6,10,18,.95);
  --root-box-bg1: #001830;
  --root-box-bg2: #002a50;
}

body.light {
  --bg: #f0f4fa;
  --border: rgba(0,100,200,0.15);
  --text: #1a2a40;
  --dim: #6080a0;
  --accent: #0070cc;
  --hdr-bg: rgba(240,244,250,.95);
  --root-box-bg1: #dce8f8;
  --root-box-bg2: #c8daf0;
}

/* ── 亮色模式：結點填色更飽滿 ── */
body.light .mod-node {
  /* 讓 inline gradient alpha 更深 — 用 filter 疊加 */
  filter: saturate(1.4) brightness(0.97);
  border-width: 2px !important;
}
body.light .lesson-box {
  filter: saturate(1.3) brightness(0.96);
  border-width: 1.5px !important;
}

/* ── 亮色模式：按鈕改為亮底暗符號 ── */
body.light .zbtn {
  background: rgba(255,255,255,.92);
  border-color: rgba(0,80,180,.2);
  color: #1a3a60;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
body.light .zbtn:hover {
  background: #e0eeff;
  border-color: var(--accent);
  color: var(--accent);
}
body.light .zbtn-expand.all-open {
  background: #d0e8ff;
  border-color: var(--accent);
  color: var(--accent);
}
body.light .rnav-btn {
  background: rgba(255,255,255,.92);
  border-color: rgba(0,80,180,.2);
  color: #1a3a60;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
body.light .rnav-btn:hover {
  background: #e0eeff;
  border-color: var(--accent);
  color: var(--accent);
}
body.light .outline-item {
  border-left-color: rgba(0,80,180,.15);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* ── HEADER ── */
#hdr {
  position: fixed; top:0; left:0; right:0; height:50px;
  background: var(--hdr-bg);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap:.9rem;
  padding: 0 1.4rem; z-index:200;
}
#hdr h1 { font-size:.92rem; font-weight:900; color:var(--accent); flex:1; letter-spacing:.04em; }
.badge { font-size:.65rem; color:var(--dim); font-family:'JetBrains Mono',monospace;
         border:1px solid var(--border); padding:.18rem .55rem; border-radius:4px; }
.hint  { font-size:.68rem; color:var(--dim); }

/* ── CANVAS ── */
#canvas {
  position:fixed; top:50px; left:0; right:0; bottom:0;
  overflow:hidden; cursor:grab;
}
#canvas:active { cursor:grabbing; }
#wrap { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }

/* ── TREE ROOT: vertical stack on the left ── */
.tree-root {
  display:flex; flex-direction:row; align-items:stretch;
  padding: 40px 60px 60px 50px; gap:0;
}

/* Left anchor: root box + two vertical connectors */
.root-anchor {
  display:flex; flex-direction:column; align-items:center;
  flex-shrink:0; gap:0;
  justify-content:center;
}

.root-box {
  flex-shrink:0;
  background: linear-gradient(135deg, var(--root-box-bg1), var(--root-box-bg2));
  border: 2px solid var(--accent);
  border-radius:14px; padding:16px 18px; text-align:center;
  min-width:110px;
  box-shadow: 0 0 36px rgba(0,180,255,.22), inset 0 1px 0 rgba(255,255,255,.05);
}
.root-icon  { font-size:1.5rem; margin-bottom:4px; }
.root-title { font-size:.88rem; font-weight:900; color:var(--accent); line-height:1.3; }
.root-sub   { font-size:.57rem; color:var(--dim); margin-top:3px; }

/* vertical line from root up to upper strip level */
.root-vline {
  width:2px; flex:1; min-height:24px;
  background:rgba(0,180,255,.35);
}

/* ── RIGHT SIDE: two strips stacked vertically ── */
.strips-col {
  display:flex; flex-direction:column; align-items:flex-start;
  gap:0; justify-content:center; align-self:stretch;
}

/* Short horizontal connector root→each strip */
.strip-hconn {
  display:flex; flex-direction:row; align-items:flex-start;
  gap:0; flex:1;
}
.strip-hconn-line {
  width:28px; height:2px; flex-shrink:0;
  background:linear-gradient(90deg,var(--accent),rgba(0,180,255,.35));
  margin-top:25px; /* align with h-spine top:25px */
}

/* ── MODULE STRIP ── */
.modules-strip {
  display:flex; flex-direction:row; align-items:flex-start;
  gap:0; position:relative;
}
.h-spine {
  position:absolute; top:25px; left:0; right:0; height:2px;
  background:rgba(0,180,255,.28); pointer-events:none;
}

/* ── MODULE COLUMN ── */
.mod-col {
  display:flex; flex-direction:column; align-items:center;
  width:var(--col-w); flex-shrink:0; padding:0 8px;
  position:relative;
}
.mod-col::before {
  content:''; position:absolute; top:25px; left:50%; width:2px; height:14px;
  background:rgba(0,180,255,.3); transform:translateX(-50%);
}

/* ── MODULE NODE ── */
.mod-node {
  margin-top:38px;
  border-radius:10px; padding:8px 10px; width:144px;
  border-width:1.5px; border-style:solid; cursor:pointer;
  transition: transform .15s, box-shadow .15s;
  text-align:center; position:relative; z-index:2;
  user-select:none;
}
.mod-node:hover { transform:translateY(-2px); }
.mod-num  { font-family:'JetBrains Mono',monospace; font-size:.57rem; opacity:.6; margin-bottom:2px; }
.mod-title{ font-size:.72rem; font-weight:700; line-height:1.35; }
.mod-sub  { font-size:.56rem; opacity:.58; margin-top:2px; }
.mod-arrow{ font-size:.55rem; margin-top:4px; opacity:.5; transition:transform .2s; }
.mod-node.open .mod-arrow { transform:rotate(180deg); opacity:.9; }

/* Vertical spine from module node down to lessons */
.mod-vline {
  width:2px;
  transition: height .3s ease, opacity .3s;
  overflow:hidden;
}

/* ── LESSONS CONTAINER ── */
.lessons-wrap {
  display:none;
  flex-direction:column; align-items:center;
  gap:0; overflow:hidden;
  max-height:0; transition: max-height .35s ease;
  width:100%;
}
.lessons-wrap.open { display:flex; max-height:9999px; }

/* ── LESSON NODE ── */
.lesson-node {
  display:flex; flex-direction:column; align-items:center;
  width:100%; padding:3px 0;
}
/* tick down from mod-vline to lesson box */
.lesson-hline {
  width:2px; height:8px; flex-shrink:0; opacity:.4;
}
.lesson-box {
  border-radius:7px; padding:5px 9px; width:140px;
  border-width:1px; border-style:solid; cursor:pointer;
  transition:all .13s; text-align:left; user-select:none;
}
.lesson-box:hover { transform:scale(1.03); }
.lesson-id   { font-family:'JetBrains Mono',monospace; font-size:.54rem; opacity:.55; }
.lesson-name { font-size:.65rem; line-height:1.3; display:block; margin-top:1px; }
.lesson-arrow{ font-size:.5rem; opacity:.45; transition:transform .18s; margin-top:3px; display:block; }
.lesson-box.open .lesson-arrow { transform:rotate(180deg); opacity:.8; }

/* ── OUTLINE (level 3) ── */
.outline-wrap {
  overflow:hidden; max-height:0;
  width:136px; margin:0 auto;
}
.outline-wrap.open { max-height:800px; }
.outline-item {
  display:flex; align-items:flex-start; gap:5px;
  padding:3px 6px 3px 8px; font-size:.6rem; color:var(--dim);
  line-height:1.4; border-left:1.5px solid rgba(255,255,255,.08);
}
.outline-dot { font-size:.45rem; margin-top:3px; flex-shrink:0; }

/* ── ZOOM CTRL ── */
#zctrl {
  position:fixed; bottom:18px; left:18px;
  display:flex; flex-direction:column; gap:4px; z-index:200;
}
.zbtn {
  width:30px; height:30px;
  background:rgba(6,10,18,.88); border:1px solid var(--border);
  border-radius:6px; color:var(--text); cursor:pointer;
  font-size:.95rem; display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(8px); transition:all .15s;
}
.zbtn:hover { background:rgba(0,180,255,.18); border-color:var(--accent); color:var(--accent); }
.zbtn-expand { font-size:1.1rem; }
.zbtn-expand.all-open { background:rgba(0,180,255,.18); border-color:var(--accent); color:var(--accent); }
.zbtn-theme { font-size:.9rem; }

/* 手機版標題列主題按鈕 */
#hdrThemeBtn {
  display:none;
  background:none; border:1px solid var(--border);
  border-radius:5px; color:var(--dim); cursor:pointer;
  font-size:.85rem; padding:.2rem .5rem;
  transition:all .15s;
}
#hdrThemeBtn:hover { border-color:var(--accent); color:var(--accent); }

/* ── ROW NAV (上下排導航) ── */
.row-nav {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px; flex-shrink:0; padding:0 8px;
  margin-top:25px; /* align with h-spine */
}
.rnav-btn {
  width:28px; height:28px;
  background:rgba(6,10,18,.88); border:1px solid var(--border);
  border-radius:6px; color:var(--dim); cursor:pointer;
  font-size:.8rem; display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(8px); transition:all .15s; user-select:none;
  line-height:1;
}
.rnav-btn:hover { background:rgba(0,180,255,.18); border-color:var(--accent); color:var(--accent); }
.rnav-btn.disabled { opacity:.2; cursor:default; pointer-events:none; }

/* ── TOOLTIP ── */
#tip {
  position:fixed; background:rgba(4,10,26,.97);
  border:1px solid rgba(0,180,255,.35); border-radius:9px;
  padding:.7rem .9rem; font-size:.74rem; color:#c0d8f0;
  max-width:270px; pointer-events:none; z-index:999;
  display:none; line-height:1.6;
  box-shadow:0 8px 28px rgba(0,0,0,.6);
}
#tip strong { font-size:.78rem; display:block; margin-bottom:.3rem; }

/* ── MOBILE ── */
@media (max-width:768px) {
  body { overflow:auto; height:auto; }
  #canvas { position:static; overflow:visible; cursor:default; height:auto; }
  #wrap { position:static; transform:none !important; }
  .tree-root {
    flex-direction:column; padding:66px 14px 60px;
    align-items:center;
  }
  .root-anchor { flex-direction:row; width:auto; }
  .root-vline { display:none; }
  .strips-col { align-items:center; width:100%; }
  .strip-hconn { justify-content:center; width:100%; }
  .strip-hconn-line { display:none; }
  .modules-strip {
    flex-direction:column; align-items:center; width:100%;
  }
  .h-spine { display:none; }
  .mod-col {
    width:auto; padding:0;
    align-items:center;
    border-left:none;
    margin-bottom:8px;
  }
  .mod-col::before { display:none; }
  .mod-node {
    margin-top:8px; width:auto; min-width:180px; text-align:center;
    transform:none !important;
  }
  .mod-node:hover { transform:none !important; }
  .mod-vline { display:none; }
  .lessons-wrap { align-items:center; padding-left:0; }
  .lesson-node { align-items:center; }
  .lesson-box {
    width:auto; min-width:160px; max-width:calc(100vw - 40px);
    transform:none !important;
  }
  .lesson-box:hover { transform:none !important; }
  .outline-wrap { width:auto; max-width:calc(100vw - 40px); margin:0; }
  #zctrl { display:none; }
  .hint { display:none; }
  .row-nav { display:none; }
  #hdrThemeBtn { display:inline-flex; align-items:center; }
}
</style>
</head>

// ══════════════════════════════════════════
//  BUILD
// ══════════════════════════════════════════
function buildStrip(mods) {
  const strip = document.createElement('div');
  strip.className = 'modules-strip';
  const hspine = document.createElement('div');
  hspine.className = 'h-spine';
  strip.appendChild(hspine);

  mods.forEach(mod => {
    const col = document.createElement('div');
    col.className = 'mod-col';

    const mn = document.createElement('div');
    mn.className = 'mod-node';
    mn.style.borderColor = mod.color + '70';
    mn.style.background = `linear-gradient(160deg,${mod.color}1a,${mod.color}08)`;
    mn.style.boxShadow = `0 2px 12px ${mod.color}18`;
    mn.innerHTML = `
      <div class="mod-num" style="color:${mod.color}">${String(mod.num).padStart(2,'0')}</div>
      <div class="mod-title" style="color:${mod.color}">${mod.title}</div>
      <div class="mod-sub">${mod.sub}</div>
      <div class="mod-arrow" style="color:${mod.color}">▼</div>
    `;

    const lw = document.createElement('div');
    lw.className = 'lessons-wrap';

    const vline = document.createElement('div');
    vline.className = 'mod-vline';
    vline.style.background = mod.color;
    vline.style.height = '0px';

    mod.lessons.forEach((lesson, li) => {
      const lessonId = `${mod.num}-${li + 1}`;
      const lnode = document.createElement('div');
      lnode.className = 'lesson-node';

      const tick = document.createElement('div');
      tick.className = 'lesson-hline';
      tick.style.background = mod.color;

      const lb = document.createElement('div');
      lb.className = 'lesson-box';
      lb.style.borderColor = mod.color + '48';
      lb.style.background = mod.color + '0e';
      lb.innerHTML = `
        <span class="lesson-id" style="color:${mod.color}">${lessonId}</span>
        <span class="lesson-name">${lesson.title}</span>
        <span class="lesson-arrow" style="color:${mod.color}">▼</span>
      `;

      const ow = document.createElement('div');
      ow.className = 'outline-wrap';
      lesson.outline.forEach(pt => {
        const oi = document.createElement('div');
        oi.className = 'outline-item';
        oi.innerHTML = `<span class="outline-dot" style="color:${mod.color}">◆</span><span>${pt}</span>`;
        ow.appendChild(oi);
      });

      lb.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = ow.classList.contains('open');

        if (!isOpen) {
          // 同模組其他課程：瞬間收起
          lw.querySelectorAll('.outline-wrap.open').forEach(o => {
            o.style.transition = 'none';
            o.classList.remove('open');
          });
          lw.querySelectorAll('.lesson-box.open').forEach(b => b.classList.remove('open'));
          // 展開本課程：有動畫
          ow.style.transition = 'max-height .3s ease';
          ow.classList.add('open');
          lb.classList.add('open');
        } else {
          // 收起本課程：瞬間
          ow.style.transition = 'none';
          ow.classList.remove('open');
          lb.classList.remove('open');
        }
      });

      lnode.appendChild(tick);
      lnode.appendChild(lb);
      lnode.appendChild(ow);
      lw.appendChild(lnode);
    });

    mn.addEventListener('click', () => {
      const isOpen = lw.classList.contains('open');

      if (!isOpen) {
        // 關閉所有其他模組（含其底下所有課程大綱）
        document.querySelectorAll('.lessons-wrap.open').forEach(w => {
          w.classList.remove('open');
          w.previousElementSibling.style.height = '0px';
          w.querySelectorAll('.outline-wrap.open').forEach(o => {
            o.style.transition = 'none';
            o.classList.remove('open');
          });
          w.querySelectorAll('.lesson-box.open').forEach(b => b.classList.remove('open'));
        });
        document.querySelectorAll('.mod-node.open').forEach(n => n.classList.remove('open'));
        // 開啟本模組
        lw.classList.add('open');
        mn.classList.add('open');
        vline.style.height = '12px';
      } else {
        // 收起本模組（含底下所有課程大綱）
        lw.classList.remove('open');
        mn.classList.remove('open');
        vline.style.height = '0px';
        lw.querySelectorAll('.outline-wrap.open').forEach(o => {
          o.style.transition = 'none';
          o.classList.remove('open');
        });
        lw.querySelectorAll('.lesson-box.open').forEach(b => b.classList.remove('open'));
      }
    });

    col.appendChild(mn);
    col.appendChild(vline);
    col.appendChild(lw);
    strip.appendChild(col);
  });

  return strip;
}

// ── 儲存/還原展開狀態 ──
function saveState() {
  const openMods = new Set();
  const openLessons = new Set(); // key: "modNum-lessonIdx"
  document.querySelectorAll('.lessons-wrap.open').forEach(lw => {
    const mn = lw.previousElementSibling?.previousElementSibling; // mod-node
    if (mn) {
      const num = mn.querySelector('.mod-num')?.textContent?.trim();
      if (num) openMods.add(num);
    }
    lw.querySelectorAll('.lesson-box.open').forEach(lb => {
      const id = lb.querySelector('.lesson-id')?.textContent?.trim();
      if (id) openLessons.add(id);
    });
  });
  return { openMods, openLessons };
}

function restoreState({ openMods, openLessons }) {
  document.querySelectorAll('.mod-col').forEach(col => {
    const mn = col.querySelector('.mod-node');
    const lw = col.querySelector('.lessons-wrap');
    const vl = col.querySelector('.mod-vline');
    const num = mn?.querySelector('.mod-num')?.textContent?.trim();
    if (num && openMods.has(num)) {
      lw.classList.add('open');
      mn.classList.add('open');
      if (vl) vl.style.height = '12px';
      // 還原課程大綱
      lw.querySelectorAll('.lesson-box').forEach(lb => {
        const id = lb.querySelector('.lesson-id')?.textContent?.trim();
        if (id && openLessons.has(id)) {
          lb.classList.add('open');
          const ow = lb.nextElementSibling;
          if (ow) { ow.style.transition = 'none'; ow.classList.add('open'); }
        }
      });
    }
  });
  // 同步 allOpen 按鈕狀態
  const total = document.querySelectorAll('.mod-col').length;
  const opened = document.querySelectorAll('.lessons-wrap.open').length;
  allOpen = opened === total;
  const btn = document.getElementById('expandBtn');
  if (btn) { btn.textContent = allOpen ? '⊟' : '⊞'; btn.classList.toggle('all-open', allOpen); }
}

function build(state) {
  const root = document.getElementById('tree-root');
  root.innerHTML = '';
  if (!state) {
    allOpen = false;
    const btn = document.getElementById('expandBtn');
    if (btn) { btn.textContent = '⊞'; btn.classList.remove('all-open'); }
  }

  const MOD_W    = 160;   // module col width (--col-w)
  const ANCHOR_W = 150;   // root anchor
  const HCONN_W  = 28;    // strip-hconn-line
  const PAD      = 110;   // .tree-root padding left+right

  const avail = cv.offsetWidth - ANCHOR_W - HCONN_W - PAD;

  // 每排模組數（至少 1）
  const perRow = Math.max(1, Math.floor(avail / MOD_W));

  // 切成多排模組
  const rows = [];
  for (let i = 0; i < MODS.length; i += perRow) {
    rows.push(MODS.slice(i, i + perRow));
  }

  // ── Left anchor ──
  const anchor = document.createElement('div');
  anchor.className = 'root-anchor';

  if (rows.length > 1) {
    const vlineTop = document.createElement('div');
    vlineTop.className = 'root-vline';
    anchor.appendChild(vlineTop);
  }

  const rootBox = document.createElement('div');
  rootBox.className = 'root-box';
  rootBox.innerHTML = `
    <div class="root-icon">⚡</div>
    <div class="root-title">電商防護盾</div>
    <div class="root-sub">完整課程地圖</div>
  `;
  anchor.appendChild(rootBox);

  if (rows.length > 1) {
    const vlineBot = document.createElement('div');
    vlineBot.className = 'root-vline';
    anchor.appendChild(vlineBot);
  }

  // ── Right: N strips ──
  const stripsCol = document.createElement('div');
  stripsCol.className = 'strips-col';

  const connEls = []; // 儲存每排的 conn 元素，供導航用

  rows.forEach((rowMods, rowIdx) => {
    const conn = document.createElement('div');
    conn.className = 'strip-hconn';
    conn.dataset.row = rowIdx;
    const connLine = document.createElement('div');
    connLine.className = 'strip-hconn-line';
    const strip = buildStrip(rowMods);
    conn.appendChild(connLine);
    conn.appendChild(strip);

    // 每排最後加導航箭頭
    const nav = document.createElement('div');
    nav.className = 'row-nav';

    const btnUp = document.createElement('button');
    btnUp.className = 'rnav-btn' + (rowIdx === 0 ? ' disabled' : '');
    btnUp.textContent = '▲';
    btnUp.title = '上一排';

    const btnDown = document.createElement('button');
    btnDown.className = 'rnav-btn' + (rowIdx === rows.length - 1 ? ' disabled' : '');
    btnDown.textContent = '▼';
    btnDown.title = '下一排';

    nav.appendChild(btnUp);
    nav.appendChild(btnDown);
    conn.appendChild(nav);
    stripsCol.appendChild(conn);
    connEls.push(conn);

    // 點擊後 pan 到目標排
    btnUp.addEventListener('click', e => { e.stopPropagation(); navigateToRow(connEls, rowIdx - 1); });
    btnDown.addEventListener('click', e => { e.stopPropagation(); navigateToRow(connEls, rowIdx + 1); });
  });

  root.appendChild(anchor);
  root.appendChild(stripsCol);

  if (state) {
    restoreState(state);
  } else {
    setTimeout(resetV, 120);
  }
}

// ══════════════════════════════════════════
//  PAN & ZOOM
// ══════════════════════════════════════════
let px=80, py=0, sc=1, drag=false, lx=0, ly=0;
const cv = document.getElementById('canvas');
const wp = document.getElementById('wrap');

const applyT = () => { wp.style.transform = `translate(${px}px,${py}px) scale(${sc})`; };

cv.addEventListener('mousedown', e => { if(e.button) return; drag=true; lx=e.clientX; ly=e.clientY; e.preventDefault(); });
window.addEventListener('mousemove', e => { if(!drag) return; px+=e.clientX-lx; py+=e.clientY-ly; lx=e.clientX; ly=e.clientY; applyT(); });
window.addEventListener('mouseup', ()=>{ drag=false; });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY>0 ? -0.1 : 0.1;
  const ns = Math.max(0.15, Math.min(3, sc+d));
  const r = cv.getBoundingClientRect();
  px = (e.clientX-r.left) - ((e.clientX-r.left)-px)*(ns/sc);
  py = (e.clientY-r.top)  - ((e.clientY-r.top)-py)*(ns/sc);
  sc=ns; applyT();
}, {passive:false});

// Touch
let t0=[];
cv.addEventListener('touchstart', e=>{ t0=[...e.touches]; if(e.touches.length===1){lx=e.touches[0].clientX;ly=e.touches[0].clientY;} },{passive:true});
cv.addEventListener('touchmove', e=>{
  if(e.touches.length===1){ px+=e.touches[0].clientX-lx; py+=e.touches[0].clientY-ly; lx=e.touches[0].clientX; ly=e.touches[0].clientY; applyT(); }
  else if(e.touches.length===2&&t0.length===2){
    const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const od=Math.hypot(t0[0].clientX-t0[1].clientX,t0[0].clientY-t0[1].clientY);
    if(od>0){sc=Math.max(0.15,Math.min(3,sc*nd/od));applyT();}
    t0=[...e.touches];
  }
},{passive:true});

function zoom(d){ sc=Math.max(0.15,Math.min(3,sc+d)); applyT(); }

// ── 亮色/暗色切換 ──
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  const icon = isLight ? '☀️' : '🌙';
  const btn = document.getElementById('themeBtn');
  const hdrBtn = document.getElementById('hdrThemeBtn');
  if (btn) btn.textContent = icon;
  if (hdrBtn) hdrBtn.textContent = icon;
}

// ── 導航到指定排 ──
function navigateToRow(connEls, targetIdx) {
  if (targetIdx < 0 || targetIdx >= connEls.length) return;
  const target = connEls[targetIdx];

  // 目標排相對於 wrap 左上角的 y 偏移（未縮放座標）
  const wrapRect = wp.getBoundingClientRect();
  const targetRect = target.getBoundingClientRect();
  const targetTopInWrap = (targetRect.top - wrapRect.top) / sc;

  // 讓目標排頂部對齊視窗上方，留 60px 邊距
  const MARGIN = 60;
  py = -(targetTopInWrap * sc) + MARGIN;

  wp.style.transition = 'transform .45s cubic-bezier(.4,0,.2,1)';
  applyT();
  setTimeout(() => { wp.style.transition = ''; }, 480);
}

// ── 展開/收合所有 ──
let allOpen = false;
function toggleAll() {
  const btn = document.getElementById('expandBtn');
  allOpen = !allOpen;
  btn.classList.toggle('all-open', allOpen);
  btn.textContent = allOpen ? '⊟' : '⊞';

  const cols = document.querySelectorAll('.mod-col');

  if (allOpen) {
    // 逐個模組展開（stagger）
    cols.forEach((col, i) => {
      setTimeout(() => {
        const mn  = col.querySelector('.mod-node');
        const lw  = col.querySelector('.lessons-wrap');
        const vl  = col.querySelector('.mod-vline');
        if (!lw.classList.contains('open')) {
          lw.classList.add('open');
          mn.classList.add('open');
          if (vl) vl.style.height = '12px';
        }
      }, i * 60);
    });
  } else {
    // 逐個模組收合（反序 stagger），結束後回到初始畫面
    const arr = Array.from(cols).reverse();
    arr.forEach((col, i) => {
      setTimeout(() => {
        const mn = col.querySelector('.mod-node');
        const lw = col.querySelector('.lessons-wrap');
        const vl = col.querySelector('.mod-vline');
        lw.classList.remove('open');
        mn.classList.remove('open');
        if (vl) vl.style.height = '0px';
        lw.querySelectorAll('.outline-wrap.open').forEach(o => {
          o.style.transition = 'none';
          o.classList.remove('open');
        });
        lw.querySelectorAll('.lesson-box.open').forEach(b => b.classList.remove('open'));
      }, i * 40);
    });
    setTimeout(resetV, arr.length * 40 + 300);
  }
}

function resetV(){
  const cw=cv.offsetWidth, ch=cv.offsetHeight;
  const tw=wp.offsetWidth||1600, th=wp.offsetHeight||400;
  sc = Math.min(cw/tw, ch/th) * 0.96;  // 96% 留小邊距
  px = (cw - tw*sc)/2;
  py = (ch - th*sc)/2;
  applyT();
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
build();
window.addEventListener('resize', () => {
  const state = saveState();
  setTimeout(() => build(state), 80);
});
</script>
